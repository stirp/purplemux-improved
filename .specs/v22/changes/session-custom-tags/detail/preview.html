<body>
  <header class="design-bar">
    <div class="design-title"><div><div class="design-kicker">PURPLEMUX / DESIGN PREVIEW</div><h1>会话标签</h1><p class="design-subtitle">按用途找到会话，按状态推进工作。</p></div></div>
    <div class="preview-tools">
      <div class="segmented" aria-label="预览尺寸"><button id="desktop-mode" aria-pressed="true">桌面</button><button id="mobile-mode" aria-pressed="false">手机</button></div>
      <button class="button" id="theme-toggle" aria-pressed="false">深色模式</button>
      <button class="button" id="reset-demo">重置演示</button>
      <label class="tool-note"><input type="checkbox" id="fail-next">模拟一次保存失败</label>
    </div>
  </header>
  <main class="app">
    <aside class="sidebar" aria-label="会话导航">
      <div class="brand"><span data-icon="terminal"></span><span class="wordmark">purplemux-improved</span><span class="version">0.5.5</span></div>
      <div class="nav-tabs"><span class="nav-tab"><span data-icon="folder"></span>工作区</span><span class="nav-tab active"><span data-icon="messages"></span>会话</span></div>
      <div class="sidebar-top">
        <div class="search-field"><span data-icon="search"></span><input id="session-search" aria-label="搜索会话" placeholder="搜索会话、项目或内容…"><button id="clear-query" class="icon-button" aria-label="清空关键词" hidden><span data-icon="x"></span></button></div>
        <div class="filter-toolbar"><div id="quick-tags" class="quick-tags"></div><button id="filter-button" class="filter-button" aria-haspopup="dialog" aria-expanded="false"></button></div>
        <div id="conditions" class="conditions"></div>
        <div id="result-line" class="result-line" aria-live="polite"></div>
      </div>
      <div id="session-list" class="session-list"></div>
      <div class="sidebar-bottom"><span data-icon="tag"></span><span>标签整理用途，工作状态独立流转</span></div>
    </aside>
    <section class="conversation" aria-label="示例对话">
      <header id="conversation-head" class="conversation-head"></header>
      <div class="conversation-scroll"><div class="conversation-inner" id="conversation-content"></div></div>
      <div class="composer"><div class="composer-box"><textarea id="draft-message" aria-label="示例消息输入" placeholder="继续与周报助手对话…"></textarea><div class="composer-tools"><span>Claude Code <span class="muted"> · 保留当前上下文</span></span><button id="send-demo" aria-label="发送示例消息"><span data-icon="arrow-up"></span></button></div></div></div>
    </section>
  </main>
  <footer class="design-footer"><span><strong>试试看：</strong>筛选标签 → 编辑周报助手的标签 → 在“管理标签”中维护目录。</span><span>交互原型 · 示例数据 · 刷新后还原</span></footer>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    const paths={terminal:'m4 6 6 6-6 6m9 0h7',folder:'M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z',messages:'M21 11a7 7 0 0 1-7 7H6l-4 3V6a3 3 0 0 1 3-3h9a7 7 0 0 1 7 8ZM6 8h9M6 12h6',tag:'M20 13 13 20a2 2 0 0 1-3 0L2 12V3h9l9 8a2 2 0 0 1 0 2ZM7 7h.01',search:'M10 3a7 7 0 1 0 0 14a7 7 0 1 0 0-14m5 12 6 6',x:'m6 6 12 12M18 6 6 18',down:'m6 9 6 6 6-6',right:'m9 6 6 6-6 6',plus:'M12 5v14M5 12h14',edit:'m4 16 12-12 4 4L8 20H4Zm10-10 4 4',check:'m5 12 4 4L19 6',clock:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18m0 4v5l3 2',circle:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18',progress:'M21 12a9 9 0 1 1-9-9m0 0v5m9 4h-5',settings:'M4 7h16M4 17h16M8 4v6m8 4v6',trash:'M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7',spark:'M12 3v18M3 12h18M6 6l12 12M6 18 18 6','arrow-up':'M12 19V5m-6 6 6-6 6 6',history:'M3 10a9 9 0 1 1 0 4M3 3v7h7m2-3v5l3 2'};
    const icon=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.tag}"/></svg>`;
    const escapeHtml=(value)=>String(value).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    document.querySelectorAll('[data-icon]').forEach((el)=>el.innerHTML=icon(el.dataset.icon));
    const initialTags=[{id:'resident',name:'常驻助手',color:'purple'},{id:'work',name:'工作',color:'gray'},{id:'weekly',name:'周报',color:'coral'},{id:'patrol',name:'巡检',color:'pink'},{id:'learning',name:'学习',color:'purple'}];
    const initialSessions=[
      {id:'patrol',title:'每日巡检助手',project:'运维工具',root:'内部工具',provider:'Codex',status:'progress',summary:'正在检查服务健康状态与告警记录',time:'正在运行',tags:['resident','patrol'],history:8},
      {id:'weekly',title:'周报助手',project:'日常协作',root:'我的工作台',provider:'Claude',status:'review',summary:'本周周报已整理，等你确认内容',time:'今天 16:42',tags:['resident','weekly','work'],history:12},
      {id:'reading',title:'技术阅读助手',project:'阅读笔记',root:'知识库',provider:'Claude',status:'completed',summary:'本次阅读笔记已确认，下次继续',time:'昨天 18:20',tags:['resident','learning'],history:6},
      {id:'login',title:'排查登录回调异常',project:'账号服务',root:'业务平台',provider:'Codex',status:'progress',summary:'正在对比回调参数与鉴权日志',time:'2 分钟前',tags:['work'],history:2},
      {id:'design',title:'会话列表布局优化',project:'purplemux-improved',root:'开发工具',provider:'Claude',status:'review',summary:'界面调整完成，等待审阅',time:'今天 15:18',tags:['work'],history:3},
      {id:'research',title:'调研消息队列选型',project:'技术研究',root:'知识库',provider:'Codex',status:'pending',summary:'准备比较业务场景与维护成本',time:'今天 09:30',tags:[],history:0}
    ];
    const statuses=[{id:'pending',name:'未开始',icon:'circle'},{id:'progress',name:'进行中',icon:'progress'},{id:'review',name:'审批中',icon:'clock'},{id:'completed',name:'已完成',icon:'check'}];
    const state={tags:structuredClone(initialTags),sessions:structuredClone(initialSessions),filters:['resident'],query:'',selected:'weekly',collapsed:new Set(),history:new Set()};
    const dialog=document.querySelector('#dialog');
    let modal=null,returnFocus=null,toastTimer;
    const byTag=(id)=>state.tags.find((tag)=>tag.id===id);
    const bySession=(id)=>state.sessions.find((session)=>session.id===id);
    const statusOf=(id)=>statuses.find((status)=>status.id===id);
    const usage=(id)=>state.sessions.filter((session)=>session.tags.includes(id)).length;
    const hasFilters=()=>!!state.query.trim()||state.filters.length>0;
    const matches=(session)=>state.filters.every((id)=>session.tags.includes(id))&&[session.title,session.project,session.root,session.summary].some((text)=>text.toLowerCase().includes(state.query.trim().toLowerCase()));
    const toast=(message)=>{const el=document.querySelector('#toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4200)};
    const tagChip=(tag,attrs='')=>`<button class="tag ${tag.color}" ${attrs}>${icon('tag')}<span>${escapeHtml(tag.name)}</span></button>`;
    const toggleFilter=(id)=>{state.filters=state.filters.includes(id)?state.filters.filter((value)=>value!==id):[...state.filters,id];renderSidebar()};
    const clearAll=()=>{state.filters=[];state.query='';document.querySelector('#session-search').value='';renderSidebar()};
    const renderCard=(session)=>{
      const status=statusOf(session.status);
      return `<article class="session-card ${session.id===state.selected?'current':''}" data-session="${session.id}">
        <button class="session-nav" data-navigate="${session.id}" ${session.id===state.selected?'aria-current="true"':''} aria-label="打开${escapeHtml(session.title)}">
          <div class="project-path">${icon('folder')}<span>${escapeHtml(session.root)}</span>${icon('right')}<span>${escapeHtml(session.project)}</span></div>
          <div class="session-title"><span class="status-${status.id}">${icon(status.icon)}</span><span class="title">${escapeHtml(session.title)}</span><span class="provider">${session.provider}</span></div>
          <p class="summary">${escapeHtml(session.summary)}</p><span class="time">${session.time}</span>
        </button>
        <div class="tag-row">${session.tags.slice(0,2).map((id)=>byTag(id)?tagChip(byTag(id),`data-filter-only="${id}" aria-label="筛选标签：${escapeHtml(byTag(id).name)}"`):'').join('')}
          ${session.tags.length>2?`<button class="more-tags" data-edit-session="${session.id}" aria-label="查看${escapeHtml(session.title)}的全部 ${session.tags.length} 个标签">+${session.tags.length-2}</button>`:''}
          ${session.tags.length?'':`<button class="text-button" data-edit-session="${session.id}">+ 添加标签</button>`}
          <button class="icon-button tag-editor" data-edit-session="${session.id}" aria-label="编辑${escapeHtml(session.title)}的标签">${icon('edit')}</button>
        </div>
        <div class="card-footer"><select data-status="${session.id}" aria-label="${escapeHtml(session.title)}的工作状态">${statuses.map((item)=>`<option value="${item.id}" ${item.id===session.status?'selected':''}>${item.name}</option>`).join('')}</select><span>工作状态</span>${session.history?`<button class="history" data-history="${session.id}" aria-expanded="${state.history.has(session.id)}">${state.history.has(session.id)?'收起历史':`较早记录 ${session.history}`} ${icon('right')}</button>`:''}</div>
        ${state.history.has(session.id)?'<div class="history-panel">较早记录（示例）<br>上一轮任务已完成，历史对话保留在当前会话中。</div>':''}
      </article>`;
    };
    const renderSidebar=()=>{
      document.querySelector('#quick-tags').innerHTML=`<button class="quick" data-all-tags aria-pressed="${!state.filters.length}">全部</button>`+state.tags.slice(0,2).map((tag)=>`<button class="quick" data-quick="${tag.id}" aria-pressed="${state.filters.includes(tag.id)}">${escapeHtml(tag.name)}</button>`).join('');
      document.querySelector('#filter-button').innerHTML=`${icon('tag')}标签${state.filters.length?`<span class="count">${state.filters.length}</span>`:''}${icon('down')}`;
      document.querySelector('#conditions').innerHTML=state.filters.length>1?`<span>同时包含</span>${state.filters.map((id)=>`<button class="condition" data-remove-filter="${id}" aria-label="移除${escapeHtml(byTag(id).name)}筛选">${escapeHtml(byTag(id).name)}${icon('x')}</button>`).join('')}`:state.filters.length&&!state.tags.slice(0,2).some((tag)=>tag.id===state.filters[0])?`<button class="condition" data-remove-filter="${state.filters[0]}" aria-label="移除${escapeHtml(byTag(state.filters[0]).name)}筛选">${escapeHtml(byTag(state.filters[0]).name)}${icon('x')}</button>`:'';
      const visible=state.sessions.filter(matches);
      document.querySelector('#result-line').innerHTML=`<span>${visible.length} 个会话${state.filters.length?' · 按工作状态分组':''}</span>${hasFilters()?'<button class="text-button" data-clear-all>清除全部筛选</button>':''}`;
      document.querySelector('#clear-query').hidden=!state.query;
      document.querySelector('#session-list').innerHTML=visible.length?statuses.map((status)=>{
        const sessions=visible.filter((session)=>session.status===status.id);
        if(!sessions.length)return '';
        const collapsed=!hasFilters()&&state.collapsed.has(status.id);
        return `<section><button class="group-heading" data-group="${status.id}" aria-expanded="${!collapsed}" ${hasFilters()?'disabled':''}>${icon(collapsed?'right':'down')}<b>${status.name}</b><span class="group-count">${sessions.length}</span></button>${collapsed?'':`<div class="group-body">${sessions.map(renderCard).join('')}</div>`}</section>`;
      }).join(''):`<div class="empty">${icon('search')}<h3>没有匹配的会话</h3><p>试试减少标签条件，或清空关键词。</p><button class="button" data-clear-all>清除全部筛选</button></div>`;
    };
    const renderConversation=()=>{
      const session=bySession(state.selected),status=statusOf(session.status),weekly=session.id==='weekly';
      document.querySelector('#conversation-head').innerHTML=`<div class="project-path">${icon('folder')}<span>${escapeHtml(session.root)}</span>${icon('right')}<span>${escapeHtml(session.project)}</span></div><span class="status-badge status-${status.id}">${icon(status.icon)} ${status.name}</span><button class="icon-button" data-edit-session="${session.id}" aria-label="编辑当前会话标签">${icon('tag')}</button>`;
      document.querySelector('#conversation-content').innerHTML=`<div class="session-context"><div class="context-overline">${session.provider.toUpperCase()} / SESSION</div><h2>${escapeHtml(session.title)}</h2><div class="context-tags">${session.tags.map((id)=>tagChip(byTag(id),`data-filter-only="${id}" aria-label="筛选标签：${escapeHtml(byTag(id).name)}"`)).join('')}<button class="icon-button" data-edit-session="${session.id}" aria-label="修改当前会话标签">${icon('plus')}</button></div></div>
        <div class="divider-label">今天 · 10 月 17 日</div><div class="message-user"><div class="message-meta">你 · 16:40</div>${weekly?'帮我整理一下本周的工作周报，延续上周的格式，重点写进展、风险和下周计划。':`继续处理${escapeHtml(session.title)}，沿用之前的工作方式。`}</div>
        <div class="assistant-message"><div class="message-meta">${icon('spark')}<strong>${session.provider}</strong><span>· 16:42</span></div><p>${weekly?'已整理本周的工作记录，沿用了上周的结构。下面是待你确认的周报草稿。':escapeHtml(session.summary)+'。以下是当前会话的示例内容。'}</p>
          <div class="report"><div class="report-head"><h3>${weekly?'本周工作周报':escapeHtml(session.title)}</h3><span>10.12 — 10.16</span></div><div class="report-section"><h4>本周进展</h4><p>${weekly?'完成会话列表的项目层级调整，统一桌面与移动端的信息展示；补充了核心交互的验证记录。':'工作记录与上下文保留在当前会话中，可随时继续处理。'}</p></div><div class="report-section"><h4>风险与待确认</h4><p>移动端窄屏场景还需持续关注，相关验证项已列入后续计划。</p></div><div class="report-section"><h4>下周计划</h4><p>完成标签交互设计评审，按确认后的范围推进实现。</p></div></div><div class="review-note">${icon(status.icon)}${status.name} · ${weekly?'确认后可将本轮工作标记为已完成':'示例会话'}</div>
        </div>`;
      document.querySelector('#draft-message').placeholder=`继续与${session.title}对话…`;
    };
    const render=()=>{renderSidebar();renderConversation()};
    const dialogHead=(title,subtitle='')=>`<div class="dialog-head"><div class="dialog-title-row"><h2 id="dialog-title">${title}</h2><button class="icon-button" data-close-dialog aria-label="关闭面板">${icon('x')}</button></div>${subtitle?`<p class="subtitle">${subtitle}</p>`:''}</div>`;
    const dialogSearch=(label,placeholder)=>`<div class="dialog-search"><div class="search-field">${icon('search')}<input id="dialog-search" aria-label="${label}" placeholder="${placeholder}" autocomplete="off"></div></div>`;
    const showDialog=(kind)=>{
      if(!dialog.open){returnFocus=document.activeElement;dialog.showModal()}
      dialog.className=kind==='filter'?'filter-dialog':'';
      dialog.style.top='';dialog.style.left='';
      if(kind==='filter'&&innerWidth>760&&!document.body.classList.contains('mobile-demo')){
        const rect=document.querySelector('#filter-button').getBoundingClientRect();
        dialog.style.top=`${Math.min(rect.bottom+8,innerHeight-450)}px`;
        dialog.style.left=`${Math.max(12,rect.right-310)}px`;
      }
      document.querySelector('#filter-button').setAttribute('aria-expanded',String(kind==='filter'));
      requestAnimationFrame(()=>dialog.querySelector('input:not([type=checkbox]):not([type=radio]),button')?.focus());
    };
    const closeDialog=()=>{if(modal?.saving)return;dialog.close();modal=null;document.querySelector('#filter-button').setAttribute('aria-expanded','false');const label=returnFocus?.getAttribute('aria-label');const replacement=label?[...document.querySelectorAll('button[aria-label]')].find((button)=>button.getAttribute('aria-label')===label):null;(returnFocus?.isConnected?returnFocus:replacement||document.querySelector('#filter-button')).focus()};
    const openFilter=()=>{
      modal={kind:'filter',query:''};
      dialog.innerHTML=`<div class="dialog-layout">${dialogHead('筛选标签','同时包含所选标签，与关键词共同筛选')}${dialogSearch('搜索筛选标签','搜索标签…')}<div class="dialog-body" id="tag-options"></div><div class="dialog-footer"><button class="management" data-manage>${icon('settings')}管理标签</button><span class="grow"></span><button class="text-button" data-clear-tags>清空</button><button class="button" data-close-dialog>完成</button></div></div>`;
      renderOptions();showDialog('filter');
    };
    const openEditor=(id)=>{
      modal={kind:'editor',sessionId:id,selected:[...bySession(id).tags],created:[],query:'',saving:false};
      dialog.innerHTML=`<div class="dialog-layout">${dialogHead('编辑标签',escapeHtml(bySession(id).title))}${dialogSearch('搜索或创建标签','搜索或创建标签…')}<div class="dialog-body" id="tag-options"></div><p class="inline-error" id="save-error" role="alert" hidden></p><div class="dialog-footer"><span id="selection-count" class="selection-count"></span><button class="button" data-close-dialog>取消</button><button class="button primary" id="save-session-tags" data-save-session>保存</button></div></div>`;
      renderOptions();showDialog('editor');
    };
    const renderOptions=()=>{
      const editing=modal.kind==='editor',tags=editing?[...state.tags,...modal.created]:state.tags,query=modal.query.trim().toLowerCase(),selected=editing?modal.selected:state.filters;
      const options=tags.filter((tag)=>tag.name.toLowerCase().includes(query));
      const canCreate=editing&&query&&!tags.some((tag)=>tag.name.toLowerCase()===query)&&[...modal.query.trim()].length<=24;
      document.querySelector('#tag-options').innerHTML=options.map((tag)=>`<label class="option"><input type="checkbox" data-tag-check="${tag.id}" ${selected.includes(tag.id)?'checked':''}><span class="dot ${tag.color}"></span><span class="option-name">${escapeHtml(tag.name)}</span>${editing?'':`<span class="usage">${usage(tag.id)}</span>`}</label>`).join('')+(canCreate?`<button class="create-option" data-create-draft>${icon('plus')}<span>创建「${escapeHtml(modal.query.trim())}」</span></button>`:'')+(!options.length&&!canCreate?`<p class="inline-hint">${query?'没有匹配的标签':'还没有标签。在管理标签中创建第一个标签。'}</p>`:'')+(editing&&[...modal.query.trim()].length>24?'<p class="inline-hint">标签名称最多 24 个字符。</p>':'');
      if(editing)document.querySelector('#selection-count').textContent=`已选 ${modal.selected.length} 个标签`;
    };
    const openManager=()=>{
      modal={kind:'manager',query:''};
      dialog.innerHTML=`<div class="dialog-layout">${dialogHead('管理标签','所有会话共用，修改后同步更新')}${dialogSearch('搜索管理标签','搜索标签…')}<div class="dialog-body" id="manage-list"></div><div class="dialog-footer"><button class="button wide" data-new-tag>${icon('plus')}新建标签</button><button class="button" data-close-dialog>完成</button></div></div>`;
      renderManager();showDialog('manager');
    };
    const renderManager=()=>{
      const tags=state.tags.filter((tag)=>tag.name.toLowerCase().includes(modal.query.trim().toLowerCase()));
      document.querySelector('#manage-list').innerHTML=tags.length?tags.map((tag)=>`<div class="manage-row"><span class="dot ${tag.color}"></span><div class="grow"><div class="name">${escapeHtml(tag.name)}</div><div class="usage">${usage(tag.id)} 个会话</div></div><button class="icon-button" data-rename-tag="${tag.id}" aria-label="编辑${escapeHtml(tag.name)}标签">${icon('edit')}</button><button class="icon-button delete" data-delete-tag="${tag.id}" aria-label="删除${escapeHtml(tag.name)}标签">${icon('trash')}</button></div>`).join(''):'<p class="inline-hint">没有标签。新建一个，用来整理你的会话。</p>';
    };
    const openTagForm=(id=null)=>{
      const tag=id?byTag(id):{name:'',color:'purple'};
      modal={kind:'tag-form',tagId:id};
      dialog.innerHTML=`<form class="dialog-layout" id="tag-form">${dialogHead(id?'编辑标签信息':'新建标签')}<div class="dialog-body form-content"><label for="tag-name">标签名称</label><input id="tag-name" type="text" value="${escapeHtml(tag.name)}" aria-describedby="name-help name-error" placeholder="例如：常驻助手" autocomplete="off"><p class="muted text-xs" id="name-help">1–24 个字符，名称不能重复</p><fieldset><legend>标签颜色</legend><div class="colors">${[['purple','紫色'],['coral','珊瑚'],['pink','粉色'],['gray','灰色']].map(([color,name])=>`<label class="color-option"><input type="radio" name="tag-color" value="${color}" ${tag.color===color?'checked':''}><span class="dot ${color}"></span>${name}</label>`).join('')}</div></fieldset></div><p class="inline-error" id="name-error" role="alert" hidden></p><div class="dialog-footer"><button type="button" class="button" data-manage>返回</button><span class="grow"></span><button type="submit" class="button primary">${id?'保存修改':'创建标签'}</button></div></form>`;
      dialog.querySelector('[data-close-dialog]').type='button';showDialog('tag-form');
    };
    const openDelete=(id)=>{
      const tag=byTag(id);modal={kind:'delete',tagId:id};
      dialog.innerHTML=`<div class="dialog-layout">${dialogHead(`删除「${escapeHtml(tag.name)}」标签？`)}<div class="delete-copy">将从 <strong>${usage(id)} 个会话</strong>中移除此标签。<br>会话和工作状态会保留。</div><div class="dialog-footer"><span class="grow"></span><button class="button" data-manage>取消</button><button class="button danger" data-confirm-delete>删除标签</button></div></div>`;showDialog('delete');
    };
    const saveSessionTags=async()=>{
      if(modal.saving)return;
      const draft=modal,session=bySession(draft.sessionId),wasVisible=matches(session),button=document.querySelector('#save-session-tags');
      modal.saving=true;button.textContent='保存中…';dialog.querySelectorAll('button,input').forEach((el)=>el.disabled=true);
      await new Promise((resolve)=>setTimeout(resolve,350));
      modal.saving=false;dialog.querySelectorAll('button,input').forEach((el)=>el.disabled=false);
      if(document.querySelector('#fail-next').checked){document.querySelector('#fail-next').checked=false;const error=document.querySelector('#save-error');error.hidden=false;error.textContent='保存失败，修改尚未生效。草稿已保留，请重试。';button.textContent='重试保存';return}
      state.tags.push(...draft.created.filter((tag)=>draft.selected.includes(tag.id)));
      session.tags=[...draft.selected];render();closeDialog();toast(wasVisible&&!matches(session)?'标签已保存，该会话不再匹配当前筛选':'标签已保存');
    };
    document.addEventListener('click',(event)=>{
      const button=event.target.closest('button');if(!button)return;
      if(button.hasAttribute('data-all-tags')){state.filters=[];renderSidebar()}
      if(button.dataset.quick){state.filters=state.filters.length===1&&state.filters[0]===button.dataset.quick?[]:[button.dataset.quick];renderSidebar()}
      if(button.dataset.removeFilter){state.filters=state.filters.filter((id)=>id!==button.dataset.removeFilter);renderSidebar()}
      if(button.hasAttribute('data-clear-all'))clearAll();
      if(button.dataset.filterOnly){state.filters=[button.dataset.filterOnly];renderSidebar()}
      if(button.dataset.editSession)openEditor(button.dataset.editSession);
      if(button.dataset.navigate){state.selected=button.dataset.navigate;render();if(innerWidth<=760||document.body.classList.contains('mobile-demo'))toast(`已选择「${bySession(state.selected).title}」（示例）`)}
      if(button.dataset.group){state.collapsed.has(button.dataset.group)?state.collapsed.delete(button.dataset.group):state.collapsed.add(button.dataset.group);renderSidebar()}
      if(button.dataset.history){state.history.has(button.dataset.history)?state.history.delete(button.dataset.history):state.history.add(button.dataset.history);renderSidebar()}
      if(button.hasAttribute('data-close-dialog'))closeDialog();
      if(button.hasAttribute('data-manage'))openManager();
      if(button.hasAttribute('data-clear-tags')){state.filters=[];renderSidebar();renderOptions()}
      if(button.hasAttribute('data-save-session'))void saveSessionTags();
      if(button.hasAttribute('data-new-tag'))openTagForm();
      if(button.dataset.renameTag)openTagForm(button.dataset.renameTag);
      if(button.dataset.deleteTag)openDelete(button.dataset.deleteTag);
      if(button.hasAttribute('data-create-draft')){const id=crypto.randomUUID();modal.created.push({id,name:modal.query.trim(),color:'purple'});modal.selected.push(id);modal.query='';document.querySelector('#dialog-search').value='';renderOptions();document.querySelector('#dialog-search').focus()}
      if(button.hasAttribute('data-confirm-delete')){const id=modal.tagId,filtered=state.filters.includes(id);state.tags=state.tags.filter((tag)=>tag.id!==id);state.sessions.forEach((session)=>session.tags=session.tags.filter((tagId)=>tagId!==id));state.filters=state.filters.filter((tagId)=>tagId!==id);render();openManager();toast(filtered?'标签已删除，对应筛选条件已移除':'标签已删除，会话已保留')}
    });
    document.addEventListener('input',(event)=>{
      if(event.target.id==='session-search'){state.query=event.target.value;renderSidebar()}
      if(event.target.id==='dialog-search'){modal.query=event.target.value;if(modal.kind==='manager')renderManager();else renderOptions()}
    });
    document.addEventListener('change',(event)=>{
      if(event.target.dataset.tagCheck){const id=event.target.dataset.tagCheck;if(modal.kind==='filter')toggleFilter(id);else{modal.selected=event.target.checked?[...modal.selected,id]:modal.selected.filter((value)=>value!==id);document.querySelector('#selection-count').textContent=`已选 ${modal.selected.length} 个标签`}}
      if(event.target.dataset.status){bySession(event.target.dataset.status).status=event.target.value;render();toast('工作状态已更新，标签保持不变（示例）')}
    });
    document.addEventListener('submit',(event)=>{
      if(event.target.id!=='tag-form')return;event.preventDefault();
      const input=document.querySelector('#tag-name'),name=input.value.trim(),error=document.querySelector('#name-error');
      const message=![...name].length?'请输入标签名称':[...name].length>24?'标签名称最多 24 个字符':state.tags.some((tag)=>tag.id!==modal.tagId&&tag.name.toLowerCase()===name.toLowerCase())?'已有同名标签，请换一个名称':'';
      if(message){error.textContent=message;error.hidden=false;input.setAttribute('aria-invalid','true');input.focus();return}
      const color=document.querySelector('input[name=tag-color]:checked').value;
      if(modal.tagId)Object.assign(byTag(modal.tagId),{name,color});else state.tags.push({id:crypto.randomUUID(),name,color});
      render();openManager();toast('标签目录已更新');
    });
    dialog.addEventListener('cancel',(event)=>{event.preventDefault();closeDialog()});
    dialog.addEventListener('keydown',(event)=>{
      if(event.key!=='Tab')return;
      const focusable=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled)')].filter((el)=>el.getClientRects().length);
      const first=focusable[0],last=focusable.at(-1);
      if(!first){event.preventDefault();return}
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
    });
    dialog.addEventListener('click',(event)=>{if(event.target!==dialog)return;const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog()});
    document.querySelector('#session-search').addEventListener('keydown',(event)=>{if(event.key==='Escape'&&!event.isComposing){event.stopPropagation();state.query='';event.target.value='';renderSidebar()}});
    document.querySelector('#filter-button').onclick=openFilter;
    document.querySelector('#clear-query').onclick=()=>{state.query='';const input=document.querySelector('#session-search');input.value='';renderSidebar();input.focus()};
    document.querySelector('#theme-toggle').onclick=(event)=>{const dark=document.body.classList.toggle('dark');event.currentTarget.textContent=dark?'浅色模式':'深色模式';event.currentTarget.setAttribute('aria-pressed',String(dark))};
    const setMode=(mobile)=>{document.body.classList.toggle('mobile-demo',mobile);document.querySelector('#mobile-mode').setAttribute('aria-pressed',String(mobile));document.querySelector('#desktop-mode').setAttribute('aria-pressed',String(!mobile))};
    document.querySelector('#mobile-mode').onclick=()=>setMode(true);
    document.querySelector('#desktop-mode').onclick=()=>setMode(false);
    document.querySelector('#reset-demo').onclick=()=>{state.tags=structuredClone(initialTags);state.sessions=structuredClone(initialSessions);state.filters=['resident'];state.query='';state.selected='weekly';state.collapsed.clear();state.history.clear();document.querySelector('#session-search').value='';document.querySelector('#fail-next').checked=false;document.querySelector('#draft-message').value='';render();toast('已恢复示例数据')};
    document.querySelector('#send-demo').onclick=()=>toast('这是标签界面原型，不会发送真实消息');
    render();
  </script>
</body>
</html>
