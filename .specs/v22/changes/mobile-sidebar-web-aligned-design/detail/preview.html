<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>移动侧栏 · 设计提案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ececf0;color:#25242b;font:14px/1.5 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #8d7ba6;outline-offset:-2px}button{border:0;background:none}header.page{max-width:1280px;margin:32px auto 24px;padding:0 24px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#686271}h1{font-size:26px;font-weight:600;margin:8px 0}header.page p{color:#6e6876;margin:0}.board{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:0 24px 28px}.sample{width:390px;flex:none}.caption{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:13px}.caption small{color:#756e7d}.phone{--bg:#f8f7fc;--fg:#27232e;--muted:#746e7e;--line:#dcd8e4;--soft:#efedf4;--selected:#eae4f2;--purple:#8b75a4;--blue:#527f9e;--amber:#876c35;--green:#51826c;position:relative;height:790px;overflow:hidden;border:1px solid #d5d1dc;border-radius:20px;background:var(--bg);color:var(--fg)}.phone.dark{--bg:#161616;--fg:#e9e7ec;--muted:#a49da9;--line:#37333b;--soft:#242227;--selected:#302a39;--purple:#b39ecb;--blue:#89acc7;--amber:#c0a16a;--green:#8ab6a1;border-color:#3b363f}.statusbar{height:32px;padding:8px 22px 0;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600}.signals{display:flex;gap:5px;align-items:center}.appbar{height:50px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px;color:var(--muted)}.appbody{padding:24px;color:var(--muted);font-size:13px}.scrim{position:absolute;inset:32px 0 0;background:#0006}.drawer{position:absolute;top:32px;bottom:0;left:0;width:min(calc(100% - 24px),400px);background:var(--bg);display:flex;flex-direction:column;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;height:52px;flex-shrink:0;padding-left:16px;gap:8px;color:var(--purple);font-weight:600;letter-spacing:-.02em}.brand span{flex:1}.iconbutton{width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}.tabs{display:flex;margin:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:3px}.tabs button{min-height:44px;flex:1;border:1px solid transparent;border-radius:6px;color:var(--muted)}.tabs button.active{background:var(--bg);border-color:var(--line);color:var(--fg);font-weight:600}.badge{font-size:11px;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin-left:5px;background:var(--selected);color:var(--purple);border:1px solid var(--line);border-radius:4px}.search{display:flex;align-items:center;gap:8px;margin:12px 12px 8px;border:1px solid var(--line);border-radius:8px;color:var(--muted);padding-left:12px;min-height:44px}.search input{color:var(--fg);background:none;border:0;width:100%;min-width:0;height:44px;font-size:14px;outline-offset:0}.search input::placeholder{color:var(--muted)}.search .iconbutton{width:44px}.list{overflow:auto;min-height:0;flex:1;padding:0 8px 12px;scrollbar-width:none}.grouphead{display:flex;align-items:center;min-height:44px;padding:6px 0 2px 4px;color:var(--muted);font-size:12px}.grouptoggle{display:flex;align-items:center;gap:6px;text-align:left;flex:1;min-height:44px}.grouptoggle span{flex:1}.grouptoggle span:last-child{flex:none}.grouphead svg{width:12px;height:12px}.grouphead .iconbutton svg{width:16px;height:16px}.row{position:relative;display:flex;min-height:48px;align-items:stretch;border:1px solid transparent;border-radius:8px}.row.current{background:var(--selected);border-color:var(--selected)}.row.current::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;background:var(--purple)}.select{display:flex;align-items:center;gap:8px;min-width:0;flex:1;text-align:left;padding:8px}.select .arrow{width:12px;height:12px;color:var(--muted)}.name{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;font-weight:500}.folder{color:var(--muted)}.branch{color:var(--blue)}.count{color:var(--muted);font-size:11px}.state{display:flex;align-items:center;gap:3px;font-size:11px;white-space:nowrap;color:var(--amber)}.state svg{height:13px;width:13px}.state.done{color:var(--green)}.child{margin-left:16px}.child::after{content:"";pointer-events:none;position:absolute;left:4px;top:0;height:24px;width:8px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}.child .select{padding-left:16px}.child .arrow{display:none}.surfaces{margin-left:32px;padding:2px 0 6px 12px;border-left:1px solid var(--line)}.surface{display:flex;align-items:center;gap:10px;text-align:left;min-height:48px;padding:8px;width:100%;border:1px solid transparent;border-radius:8px;color:var(--muted)}.surface.active{background:var(--soft);border-color:var(--line);color:var(--fg)}.surface .texts{flex:1;min-width:0}.surface .texts span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}.surface .texts small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px;color:var(--muted);margin-top:2px}.surface .dot{height:6px;width:6px;flex:none;background:var(--blue);border-radius:50%}.footer{border-top:1px solid var(--line);padding:8px 12px 12px;flex-shrink:0}.create{display:flex;gap:6px}.new{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;flex:1;border:1px solid var(--line);border-radius:8px;font-weight:500}.tools{display:flex;align-items:center;margin-top:6px;gap:4px;flex-wrap:wrap}.tool{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 10px;color:var(--muted);font-size:12px}.settings{margin-left:auto}.homebar{height:4px;width:110px;border-radius:4px;background:var(--fg);opacity:.65;margin:6px auto 0}.empty{padding:28px 12px;color:var(--muted);text-align:center;font-size:13px}.sheetshade{position:absolute;inset:32px 0 0;background:#0005}.actionpanel{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;max-height:90%;overflow:auto;padding:0 16px 16px}.handle{height:4px;width:32px;background:var(--line);border-radius:4px;margin:10px auto 4px}.paneltitle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}.paneltitle span{flex:1;min-width:0;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);line-height:1.8;padding:2px 0 14px;overflow-wrap:anywhere}.meta p{margin:4px 0}.meta label{color:var(--fg);margin-right:10px}.actionlist{border-top:1px solid var(--line);padding-top:8px}.action{display:flex;gap:12px;align-items:center;min-height:48px;width:100%;text-align:left}.action.danger{color:#ae625f;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}.note{max-width:1250px;padding:0 24px 28px;margin:auto;color:#6e6876;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;background:#302a39;color:white;border:1px solid #5c5268;border-radius:8px;padding:12px 20px;max-width:90vw}.hidden,[hidden]{display:none!important}dialog{padding:0;border:0;background:none;max-width:390px;width:calc(100% - 24px);color:inherit}dialog::backdrop{background:#0007}dialog .phone{height:auto;border-radius:16px}dialog .actionpanel{position:relative;max-height:85vh;border-radius:16px}dialog .homebar{display:none}body>dialog{margin:auto auto 16px}@media(max-width:800px){.board{justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 24px;gap:16px}.sample{width:min(390px,calc(100vw - 32px));scroll-snap-align:center}.phone{height:790px}.caption small{font-size:10px}h1{font-size:22px}}@media(max-width:370px){.state .label{display:none}.brand{font-size:13px}}
</style>
</head>
<body>
<header class="page"><div class="eyebrow">PURPLEMUX / MOBILE NAVIGATION</div><h1>熟悉的项目树，更适合手指的导航。</h1><p>沿用 Web 的视觉语言，重新安排移动端的信息密度与操作入口。</p></header>
<main class="board" id="board"></main>
<p class="note">设计提案 · 示例数据 · 可尝试搜索、展开项目、选择 Tab 和点击“更多”。创建、工具、会话和管理操作仅演示反馈，不访问真实数据。</p>
<dialog id="actions" aria-label="项目操作"><div class="phone"><div class="actionpanel" id="dialog-panel"></div></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const paths={folder:'M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z',branch:'M6 3v12a4 4 0 0 0 4 4h2 M6 8h8a4 4 0 0 0 4-4 M4 3a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M16 3a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M12 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0',down:'m7 10 5 5 5-5',right:'m10 7 5 5-5 5',x:'m6 6 12 12M18 6 6 18',more:'M4 12h.01M12 12h.01M20 12h.01',search:'M10 3a7 7 0 1 0 0 14a7 7 0 1 0 0-14m5 12 6 6',plus:'M12 5v14M5 12h14',terminal:'m4 6 6 6-6 6m9 0h7',clock:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18m0 4v5l3 2',check:'m5 12 4 4L19 6',settings:'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z',chart:'M4 3v17h17M8 16v-4m5 4V6m5 10v-7',file:'M14 3H5v18h14V8Zm0 0v5h5M8 12h8m-8 4h8',edit:'m4 16 12-12 4 4L8 20H4Zm10-10 4 4',trash:'M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7',wifi:'M4 8a12 12 0 0 1 16 0M7 12a7 7 0 0 1 10 0m-7 4a3 3 0 0 1 4 0m-2 3h.01',battery:'M3 6h16v12H3ZM21 10v4',menu:'M4 6h16M4 12h16M4 18h16',agent:'M12 3v18M3 12h18M6 6l12 12M6 18 18 6'};
const icon=(name,cls='')=>`<svg style="${name==='more'?'stroke-width:3':''}" class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.folder}"/></svg>`;
const data=[{id:'purple',name:'purplemux-improved',group:'生产力',path:'~/Projects/purplemux',count:2},{id:'mobile',name:'移动端侧边栏优化',group:'生产力',parent:'purple',path:'~/Projects/purplemux/.worktrees/mobile-sidebar',branch:'feat/mobile-sidebar',state:'审批中',active:true},{id:'input',name:'输入体验优化',group:'生产力',parent:'purple',path:'~/Projects/purplemux/.worktrees/input',branch:'feat/input',state:'待输入'},{id:'vibe',name:'MyVibeHarness',group:'生产力',path:'~/Projects/MyVibeHarness',state:'已完成'},{id:'personna',name:'personna',group:'其他项目',path:'~/Projects/personna'},{id:'infra',name:'IT-infrastructure',group:'其他项目',path:'~/Projects/IT-infrastructure'}];
const escapeHtml=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stateHtml=(d)=>!d.state?'':`<span class="state ${d.state==='已完成'?'done':''}" aria-label="${d.state}">${icon(d.state==='已完成'?'check':'clock')}<span class="label">${d.state==='已完成'?'':d.state}</span></span>`;
const panel=(d,staticPanel=false)=>`<div class="handle"></div><div class="paneltitle">${icon(d.parent?'branch':'folder')}<span>${escapeHtml(d.name)}</span><button class="iconbutton" aria-label="关闭项目操作" ${staticPanel?'data-demo="点击任意项目更多按钮可体验可关闭面板"':'data-close'}>${icon('x')}</button></div><div class="meta"><p><label>目录</label>${escapeHtml(d.path)}</p>${d.branch?`<p><label>分支</label>${escapeHtml(d.branch)}</p>`:''}<p><label>状态</label>${d.state||'未开始'}</p></div><div class="actionlist">${[['branch','新建 Worktree'],['folder','管理 Worktree'],['folder','移至分组'],['edit','重命名']].map(([i,l])=>`<button class="action" data-demo="${l}：设计演示，不执行操作" ${d.parent&&l==='移至分组'?'disabled':''}>${icon(i)}${l}</button>`).join('')}<button class="action danger" data-demo="实际删除将进入二次确认；预览不执行删除">${icon('trash')}删除工作区</button></div><div class="homebar"></div>`;
const row=(d)=>`<div class="row ${d.parent?'child':''} ${d.active?'current':''}" data-row="${d.id}"><button class="select" aria-label="选择${d.name}" aria-expanded="${d.active||!!d.count}" ${d.active?'aria-current="true"':''} data-select="${d.id}">${icon(d.active||d.count?'down':'right','arrow')}${icon(d.parent?'branch':'folder',d.parent?'branch':'folder')}<span class="name">${d.name}</span>${d.count?`<span class="count">${d.count}</span>`:''}${stateHtml(d)}</button><button class="iconbutton" aria-label="${d.name}：更多" data-more="${d.id}">${icon('more')}</button></div>${d.id==='mobile'?`<div class="surfaces" data-surfaces="mobile"><button class="surface active" aria-current="true" data-surface="Codex · 侧栏设计">${icon('agent')}<span class="texts"><span>Codex · 侧栏设计</span><small>已完成布局调整，等待审阅</small></span><span class="state" aria-label="审批中">${icon('clock')}</span></button><button class="surface" data-surface="终端">${icon('terminal')}<span class="texts"><span>终端</span></span></button></div>`:''}`;
const drawer=()=>`<div class="drawer"><div class="brand">${icon('terminal')}<span>purplemux-improved</span><button class="iconbutton" data-dismiss aria-label="关闭导航">${icon('x')}</button></div><div class="tabs" aria-label="导航类型"><button class="active" data-demo="当前展示工作区导航">工作区</button><button data-demo="会话视图沿用现有分类与状态规则">会话<span class="badge">3</span></button></div><label class="search">${icon('search')}<input aria-label="搜索工作区、目录或分支" placeholder="搜索工作区…"><button class="iconbutton" aria-label="清空搜索" data-clear hidden>${icon('x')}</button></label><div class="list">${['生产力','其他项目'].map(g=>`<section data-group="${g}"><div class="grouphead"><button class="grouptoggle" aria-expanded="true">${icon('down')}<span>${g}</span><span>${data.filter(d=>d.group===g).length}</span></button><button class="iconbutton" aria-label="${g}分组操作" data-demo="分组菜单保留重命名和取消分组">${icon('more')}</button></div><div class="groupbody">${data.filter(d=>d.group===g).map(row).join('')}</div></section>`).join('')}<div class="empty" hidden>没有匹配的工作区<br>尝试项目名称、目录或分支</div></div><div class="footer"><div class="create"><button class="new" data-demo="新建工作区：沿用已有目录选择流程">${icon('plus')}新建工作区</button><button class="iconbutton" aria-label="新建分组" data-demo="新建分组：沿用已有流程">${icon('folder')}</button></div><div class="tools"><button class="tool" data-demo="文档入口演示">${icon('file')}文档</button><button class="tool" data-demo="统计入口演示">${icon('chart')}统计</button><button class="tool settings" data-demo="设置入口演示">${icon('settings')}设置</button></div><div class="homebar"></div></div></div>`;
const sample=(dark,title,subtitle,withPanel)=>`<section class="sample"><div class="caption"><span>${title}</span><small>${subtitle}</small></div><div class="phone ${dark?'dark':''}"><div class="statusbar"><span>9:41</span><span class="signals">${icon('wifi')}${icon('battery')}</span></div><div class="appbar"><button class="iconbutton" data-reopen aria-label="打开导航">${icon('menu')}</button>移动端侧边栏优化</div><div class="appbody">Codex · 侧栏设计<br><br>继续当前会话</div><div class="scrim" data-dismiss></div>${drawer()}${withPanel?`<div class="sheetshade"></div><div class="actionpanel">${panel(data[0],true)}</div>`:''}</div></section>`;
document.querySelector('#board').innerHTML=sample(false,'01 / 浅色 · 项目导航','390px / 触控布局',false)+sample(true,'02 / 深色 · 同一套层级','跟随现有主题',false)+sample(false,'03 / 项目操作 · 按需展开','完整信息与操作集中展示',true);
const dialog=document.querySelector('#actions');
let toastTimer;
const toast=(message)=>{const el=document.querySelector('#toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2500)};
const filter=(input)=>{const drawerEl=input.closest('.drawer');const q=input.value.trim().toLowerCase();const visible=new Set();data.forEach(d=>{if([d.name,d.path,d.branch||''].some(v=>v.toLowerCase().includes(q))){visible.add(d.id);if(d.parent)visible.add(d.parent)}});drawerEl.querySelectorAll('[data-row]').forEach(el=>el.hidden=!visible.has(el.dataset.row));drawerEl.querySelectorAll('[data-surfaces]').forEach(el=>el.hidden=!!q||drawerEl.querySelector(`[data-select="${el.dataset.surfaces}"]`).getAttribute('aria-expanded')!=='true');drawerEl.querySelectorAll('[data-group]').forEach(el=>{el.hidden=![...el.querySelectorAll('[data-row]')].some(r=>!r.hidden);el.querySelector('.groupbody').hidden=q?false:el.querySelector('.grouptoggle').getAttribute('aria-expanded')!=='true'});if(!q)drawerEl.querySelectorAll('[data-select]').forEach(b=>{if(b.getAttribute('aria-expanded')==='false')data.filter(d=>d.parent===b.dataset.select).forEach(d=>drawerEl.querySelector(`[data-row="${d.id}"]`).hidden=true)});drawerEl.querySelector('[data-clear]').hidden=!q;drawerEl.querySelector('.empty').hidden=visible.size!==0};
document.addEventListener('input',e=>{if(e.target.matches('.search input'))filter(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&e.target.matches('.search input')&&!e.isComposing){e.target.value='';filter(e.target)}});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-dismiss]');if(!b)return;const phone=b.closest('.phone');if(b.dataset.demo){toast(b.dataset.demo);return}if(b.hasAttribute('data-close')){dialog.close();return}if(b.dataset.more){const d=data.find(d=>d.id===b.dataset.more);document.querySelector('#dialog-panel').innerHTML=panel(d);dialog.querySelector('.phone').classList.toggle('dark',phone.classList.contains('dark'));dialog.showModal();return}if(b.hasAttribute('data-clear')){const input=b.closest('.drawer').querySelector('input');input.value='';filter(input);input.focus();return}if(b.hasAttribute('data-dismiss')){phone.querySelector('.drawer').hidden=true;phone.querySelector('.scrim').hidden=true;return}if(b.hasAttribute('data-reopen')){phone.querySelector('.drawer').hidden=false;phone.querySelector('.scrim').hidden=false;return}if(b.classList.contains('grouptoggle')){if(phone.querySelector('input').value.trim())return;const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));b.closest('section').querySelector('.groupbody').hidden=open;return}if(b.dataset.select){const id=b.dataset.select;const open=b.getAttribute('aria-expanded')==='true';phone.querySelectorAll('[data-row]').forEach(r=>r.classList.toggle('current',r.dataset.row===id));phone.querySelectorAll('[data-select]').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','true');b.setAttribute('aria-expanded',String(!open));if(!phone.querySelector('input').value.trim()){data.filter(d=>d.parent===id).forEach(d=>{phone.querySelector(`[data-row="${d.id}"]`).hidden=open;const tabs=phone.querySelector(`[data-surfaces="${d.id}"]`);if(tabs)tabs.hidden=open});const tabs=phone.querySelector(`[data-surfaces="${id}"]`);if(tabs)tabs.hidden=open}return}if(b.dataset.surface){phone.querySelectorAll('.surface').forEach(s=>{s.classList.remove('active');s.removeAttribute('aria-current')});b.classList.add('active');b.setAttribute('aria-current','true');phone.querySelector('.drawer').hidden=true;phone.querySelector('.scrim').hidden=true;phone.querySelector('.appbody').textContent=b.dataset.surface+' · 已选择（演示）';}});
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
</script>
</body></html>
